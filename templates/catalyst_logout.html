<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Signing out · KSP Intelligence</title>
    <style>
        body{min-height:100vh;margin:0;display:grid;place-items:center;background:#071b33;color:#eef5fb;font-family:Inter,system-ui,sans-serif}
        main{max-width:430px;padding:34px;text-align:center;border:1px solid #ffffff24;border-radius:18px;background:#ffffff0d;box-shadow:0 24px 80px #0005}
        h1{margin:0 0 10px;font-size:24px}p{color:#b9cadd;line-height:1.55}a{display:inline-flex;margin-top:12px;padding:12px 18px;border-radius:9px;background:#d4a733;color:#071b33;font-weight:800;text-decoration:none}
    </style>
</head>
<body><main><h1>Signing out securely</h1><p id="status">Closing your Catalyst and CrimeGPT sessions…</p><a id="continue" href="{{ login_url }}" hidden>Continue to secure sign in</a></main>
<script src="https://static.zohocdn.com/catalyst/sdk/js/4.0.0/catalystWebSDK.js"></script>
<script src="/__catalyst/sdk/init.js"></script>
<script>
    (function () {
        var loginUrl = {{ login_url|tojson }};
        var fallback = window.setTimeout(function () {
            document.getElementById('status').textContent = 'Your local session is closed. Continue to the secure sign-in portal.';
            document.getElementById('continue').hidden = false;
        }, 3500);
        try {
            if (window.catalyst && catalyst.auth) {
                window.clearTimeout(fallback);
                catalyst.auth.signOut(loginUrl);
            }
        } catch (error) {
            window.clearTimeout(fallback);
            document.getElementById('status').textContent = 'Your local session is closed. Continue to the secure sign-in portal.';
            document.getElementById('continue').hidden = false;
        }
    }());
</script>
</body>
</html>
